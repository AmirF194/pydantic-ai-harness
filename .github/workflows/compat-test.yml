name: Compat Test

# Reusable workflow: install harness against an arbitrary pydantic-ai ref and run
# the harness's lint, typecheck, and test suite. Called from pydantic-ai's CI to
# verify that pydantic-ai PRs don't break the harness's contract before merge.
#
# Security: the called pydantic-ai ref may come from an untrusted fork PR, so
# this workflow runs without secrets and only with `contents: read`. That keeps
# fork PR exposure equivalent to pydantic-ai's regular `ci.yml` test jobs.
#
# **If you add steps that need elevated permissions or secrets** (Anthropic API
# key, write tokens, deploy creds, anything posting to external services), the
# caller (pydantic-ai's `harness-compat.yml`) needs to gate fork PRs at the
# job level so untrusted code can't be triggered with the new privileges. The
# original `safe-for-ci` label gate was removed once the workflow's scope was
# stable at `contents: read` — adding it back is the standard pattern if scope
# grows.

on:
  workflow_call:
    inputs:
      pydantic-ai-ref:
        description: 'SHA, branch, or tag of pydantic-ai to test the harness against.'
        type: string
        required: true
      pydantic-ai-repo:
        description: 'Repository hosting the pydantic-ai ref. Pass the fork''s full_name when testing fork PRs.'
        type: string
        required: false
        default: pydantic/pydantic-ai
      harness-ref:
        description: 'SHA, branch, or tag of pydantic-ai-harness to test. Release gates pass the latest published tag.'
        type: string
        required: false
        default: main

permissions:
  contents: read

jobs:
  compat:
    name: harness vs pydantic-ai @ ${{ inputs.pydantic-ai-ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout harness @ ${{ inputs.harness-ref }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pydantic/pydantic-ai-harness
          ref: ${{ inputs.harness-ref }}
          persist-credentials: false

      # Check out pydantic-ai into a workspace subdir, then move it OUTSIDE the
      # harness tree (`actions/checkout` requires `path:` to live under
      # `$GITHUB_WORKSPACE`, but tools that walk the harness tree — pyright,
      # ruff, pytest collection — must not see the pydantic-ai checkout, or
      # they'll surface thousands of unrelated findings from pydantic-ai's own
      # `tests/`. `${{ runner.temp }}` lives outside workspace so it's invisible
      # to those walkers.
      - name: Checkout pydantic-ai @ ${{ inputs.pydantic-ai-ref }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.pydantic-ai-repo }}
          ref: ${{ inputs.pydantic-ai-ref }}
          path: _pydantic-ai-checkout
          # Full history, so the tags `uv-dynamic-versioning` reads are present: a
          # shallow checkout builds the packages as `0.0.1.dev1+<sha>`, which fails the
          # harness's own `pydantic-ai-slim>=2.28.0` requirement once they're resolved
          # rather than force-installed.
          fetch-depth: 0
          persist-credentials: false
      - name: Move pydantic-ai outside the harness tree
        run: mv _pydantic-ai-checkout "${RUNNER_TEMP}/pydantic-ai"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job has no write permissions and no secrets
          cache-suffix: compat

      # Resolve `pydantic-ai-slim` and `pydantic-graph` from the checkout instead of
      # from PyPI, so the candidate's declared *requirements* are tested alongside its
      # code: a PR that raises a dependency floor (say `anthropic>=1.0.0`) would
      # otherwise run against whatever the harness lock pinned, and fail on a
      # combination the candidate itself declares unsupported. Both are sibling
      # packages in the pydantic-ai repo and version-track together, so taking slim
      # from source against a released graph would mask cross-package issues.
      # `[tool.uv.sources]` redirects every harness requirement on either package,
      # extras (`pydantic-ai-slim[anthropic]`) included.
      - name: Resolve pydantic-ai from the checkout
        run: |
          cat >> pyproject.toml <<EOF

          [tool.uv.sources]
          pydantic-ai-slim = { path = "${RUNNER_TEMP}/pydantic-ai/pydantic_ai_slim", editable = true }
          pydantic-graph = { path = "${RUNNER_TEMP}/pydantic-ai/pydantic_graph", editable = true }
          EOF

      # `override-dependencies` *replaces* what any dependent declares for the packages
      # it names — it exists because `browser-use` pins provider SDKs that conflict with
      # slim's floors — so an overridden package keeps its locked version even when the
      # candidate raises that floor. Upgrade exactly the overridden packages, derived from
      # `pyproject.toml` so the list cannot drift. Everything else stays at the harness's
      # locked version: that is what keeps this a compat test rather than a latest-everything run.
      - name: Install the harness against the candidate
        run: |
          upgrade_overridden=$(python3 - <<'PY'
          import re
          import tomllib

          with open('pyproject.toml', 'rb') as f:
              specs = tomllib.load(f)['tool']['uv'].get('override-dependencies', [])
          print(' '.join(f'--upgrade-package {re.match(r"[A-Za-z0-9._-]+", spec).group()}' for spec in specs))
          PY
          )
          uv sync --all-extras --group lint --group dev ${upgrade_overridden}

      # Keep `--no-sync`: a bare `uv run` re-resolves, which would drop the targeted
      # upgrades above and restore the locked provider SDKs.
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest

      - name: Verify the requested pydantic-ai checkout remained installed
        run: |
          uv pip show pydantic-ai-slim \
            | grep -Fx "Editable project location: ${RUNNER_TEMP}/pydantic-ai/pydantic_ai_slim"
          uv pip show pydantic-graph \
            | grep -Fx "Editable project location: ${RUNNER_TEMP}/pydantic-ai/pydantic_graph"
