t"}},{"name":"write_file","description":"<summary>Create or overwrite a file with conflict detection.</summary>\n<returns>\n<description>Confirmation message with new hash.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"path":{"description":"File path relative to the root directory.","type":"string"},"content":{"description":"The text content to write.","type":"string"},"expected_hash":{"default":null,"description":"If provided, the write is rejected when the file exists\nand its current hash doesn''t match (optimistic concurrency).","anyOf":[{"type":"string"},{"type":"null"}]}},"required":["path","content"],"type":"object"}},{"name":"edit_file","description":"<summary>Edit a file by exact string replacement with conflict detection.\n\nThe old_text must appear exactly once in the file. Include surrounding\ncontext lines to ensure uniqueness.</summary>\n<returns>\n<description>Summary with new hash for subsequent operations.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"path":{"description":"File path relative to the root directory.","type":"string"},"old_text":{"description":"The exact text to find (must appear exactly once).","type":"string"},"new_text":{"description":"The replacement text.","type":"string"},"expected_hash":{"default":null,"description":"If provided, rejects the edit when the file''s\ncurrent hash doesn''t match (optimistic concurrency).","anyOf":[{"type":"string"},{"type":"null"}]}},"required":["path","old_text","new_text"],"type":"object"}},{"name":"list_directory","description":"<summary>List the contents of a directory.</summary>\n<returns>\n<description>A newline-separated listing with type indicators and sizes.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"path":{"default":".","description":"Directory path relative to the root directory.","type":"string"}},"type":"object"}},{"name":"search_files","description":"<summary>Search file contents using a regular expression.</summary>\n<returns>\n<type>str</type>\n<description>Matching lines formatted as file:line_number:text.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"pattern":{"description":"Regex pattern to search for.","type":"string"},"path":{"default":".","description":"Directory to search in, relative to the root directory.","type":"string"},"include_glob":{"default":null,"description":"If provided, only search files matching this glob (e.g. ''*.py'').","anyOf":[{"type":"string"},{"type":"null"}]}},"required":["pattern"],"type":"object"}},{"name":"find_files","description":"<summary>Find files by glob pattern (name matching, not content search).</summary>\n<returns>\n<description>Newline-separated list of matching file paths relative to root.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"pattern":{"description":"Glob pattern to match (e.g. ''*.py'', ''**/*.json'').","type":"string"},"path":{"default":".","description":"Directory to search in, relative to the root directory.","type":"string"}},"required":["pattern"],"type":"object"}},{"name":"create_directory","description":"<summary>Create a directory and any missing parents.</summary>\n<returns>\n<description>Confirmation message.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"path":{"description":"Directory path relative to the root directory.","type":"string"}},"required":["path"],"type":"object"}},{"name":"file_info","description":"<summary>Get metadata about a file or directory.</summary>\n<returns>\n<description>Formatted metadata including size, type, and permissions.</description>\n</returns>","input_schema":{"additionalProperties":false,"properties":{"path":{"description":"File or directory path relative to the root directory.","type":"string"}},"required":["path"],"type":"object"}},{"name":"run_command","description":"<summary>Execute a shell command 