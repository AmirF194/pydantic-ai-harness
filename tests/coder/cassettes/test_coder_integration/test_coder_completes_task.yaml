g","in_progress","completed","cancelled","blocked"],"type":"string"}}}},{"name":"read_plan","description":"Read the current plan: each step''s id, content, and status, plus a progress summary. Use it before granular edits (the ids come from here) and to check what is left.","input_schema":{"additionalProperties":false,"properties":{},"type":"object"}},{"name":"add_task","description":"Append one new `pending` step without replacing the plan. Prefer this over write_plan when you only need to add a single step.","input_schema":{"additionalProperties":false,"properties":{"content":{"description":"The step description in imperative form.","type":"string"},"active_form":{"default":"","description":"Optional present-continuous label, e.g. \"Fix bug\" -> \"Fixing bug\".","type":"string"}},"required":["content"],"type":"object"}},{"name":"update_task_status","description":"Update one step''s status by id. Set `in_progress` when you START a step and `completed` when it is fully done -- never mark work complete while tests fail or the implementation is partial.","input_schema":{"additionalProperties":false,"properties":{"task_id":{"description":"Id of the step to update.","type":"string"},"status":{"$ref":"#/$defs/TaskStatus","description":"New status."}},"required":["task_id","status"],"type":"object","$defs":{"TaskStatus":{"description":"Lifecycle status of a single plan step.\n\n`blocked` is only reachable when the capability runs with\n`enable_subtasks=True`; otherwise the toolset rejects it.","enum":["pending","in_progress","completed","cancelled","blocked"],"type":"string"}}}},{"name":"update_task_statuses","description":"Update several steps'' statuses in one call -- ideal for handing off from a finished step to the next one. The whole batch is validated first: if any entry is invalid nothing is applied and the errors are returned. Entries apply in order, so when a batch both completes a prerequisite and starts its dependent, list the prerequisite''s completion first."