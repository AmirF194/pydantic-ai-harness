      body: '{"include":["reasoning.encrypted_content"],"input":[{"role":"user","content":"Compare the free-threaded Python support in CPython 3.13 and 3.14 using official sources. Delegate the 3.13 investigation to the researcher sub-agent while you investigate 3.14, then synthesize the maturity status and main limitations. Search for and read the sources needed for each version, and include direct links."},{"name":"delegate_task","arguments":"{\"agent_name\":\"researcher\",\"task\":\"Investigate free-threaded Python support specifically in CPython/Python 3.13 using only official primary sources (python.org, docs.python.org, peps.python.org, official CPython GitHub if necessary). Search broadly and read the supporting sources. Report: maturity/experimental status, how users obtain/enable it, ABI/build-tag details, extension compatibility behavior and GIL fallback, known limitations (performance, specialization/JIT, immortalization, memory use, unsupported features), and any relevant packaging/ecosystem implications. Include direct source URLs for every factual claim and distinguish sourced facts from inference. Do not cover 3.14 except where an official source directly compares versions.\"}","call_id":"call_qA5Ef9pl7orsjfymFbkdkQpI","type":"function_call","id":"fc_0e22809e58aac363006a7f800cb2308190a4f81bda7ad6836d"},{"type":"function_call_output","call_id":"call_qA5Ef9pl7orsjfymFbkdkQpI","output":"[Tool output too large (18,734 chars); stored to handle ''01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0''. Read it with read_tool_result(handle=''01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0'', offset=0, limit=200, from_end=False, pattern=None).]\n# CPython 3.13 free-threaded support\n\n## Executive summary\n\n**Sourced fact:** CPython 3.13’s free-threaded build is **experimental, optional, and not enabled in the normal CPython build**. PEP 703 itself is accepted/final, but the shipped 3.13 implementation is still explicitly described as experimental, with expected bugs and substantial single-threaded overhead. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSources:  \n<https://docs.python.org/3.13/howto/free-threading-python.html>  \n...[17,734 chars omitted]...\nion opt-in, and substantive thread-safety work. Unsupported extensions cause a process-wide GIL fallback unless the user forcibly overrides it. The most consequential 3.13 limitations are approximately 40% Python-code overhead, disabled specialization and effectively unavailable JIT acceleration, broad immortalization with possible memory growth, unsafe cross-thread frame access, unsafe shared iterators, no Stable ABI/Limited API distribution target, and restrictions on custom memory allocators."},{"id":"ws_0e22809e58aac363006a7f80b8b4fc819098bae51ad0c49d36","action":{"type":"search","queries":["site:docs.python.org/3.14 howto free threading Python 3.14","site:docs.python.org/3.14 whatsnew 3.14 free-threaded Python","site:peps.python.org free-threaded Python 3.14 PEP 779","site:python.org Python 3.14 free-threaded officially supported"],"query":"site:docs.python.org/3.14 howto free threading Python 3.14"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80bc82cc8190a83f00c9acb010e9","action":{"type":"search","queries":["site:docs.python.org/3.14/howto free-threading-extensions limited API stable ABI free-threaded","site:docs.python.org/3.14/c-api free-threaded Py_GIL_DISABLED extension module GIL","site:packaging.python.org free-threaded cp314t wheel tag official","site:peps.python.org cp314t free threaded ABI tag"],"query":"site:docs.python.org/3.14/howto free-threading-extensions limited API stable ABI free-threaded"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80c029208190ade969ee5c3622b7","action":{"type":"open_page","url":"https://peps.python.org/pep-0779/"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80c2c0dc8190a896243925e3b3b2","action":{"type":"open_page","url":"https://docs.python.org/3.13/howto/free-threading-python.html"},"status":"completed","type":"web_search_call"},{"name":"read_tool_result","arguments":"{\"handle\":\"01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0\",\"offset\":0,\"limit\":120}","call_id":"call_A0K8Cm58j9hDaLmoqUTZxaVI","type":"function_call","id":"fc_0e22809e58aac363006a7f80c5f7ac8190a53170a0a6f37d5a"},{"type":"function_call_output","call_id":"call_A0K8Cm58j9hDaLmoqUTZxaVI","output":"[handle ''01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0'': 306 matching line(s); showing 120]\n# CPython 3.13 free-threaded support\n\n## Executive summary\n\n**Sourced fact:** CPython 3.13’s free-threaded build is **experimental, optional, and not enabled in the normal CPython build**. PEP 703 itself is accepted/final, but the shipped 3.13 implementation is still explicitly described as experimental, with expected bugs and substantial single-threaded overhead. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSources:  \n<https://docs.python.org/3.13/howto/free-threading-python.html>  \n<https://peps.python.org/pep-0703/>\n\n**Practical assessment — inference:** Treat 3.13 free-threading as a testing, porting, and evaluation target rather than a transparent production replacement for ordinary CPython. That inference follows from its experimental designation, approximately 40% Python-code overhead, disabled specialization, native-extension ABI split, automatic GIL fallback, and documented crash-prone cases.\n\n---\n\n## 1. Maturity and experimental status\n\n- **CPython 3.13 as a release is stable, but its free-threaded build mode is experimental.** It is not enabled by default, may contain bugs, and has a substantial single-threaded performance penalty. ([python.org](https://www.python.org/downloads/release/python-3130/?utm_source=openai))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html>  \n  <https://www.python.org/downloads/release/python-3130/>\n\n- **PEP 703 is “Final” and targets Python 3.13.** This means the proposal was accepted and implemented; it does **not** override the 3.13 documentation’s experimental-status warning. The Steering Council’s acceptance also explicitly provided for gradual rollout and possible rollback if disruption proved excessive. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://peps.python.org/pep-0703/>\n\n- **The capability is a separate CPython build configuration**, not merely a switch that turns an ordinary 3.13 installation into free-threaded CPython. The free-threaded executable is normally named `python3.13t` or `python3.13t.exe`. ([github.com](https://github.com/python/cpython/blob/main/Doc/whatsnew/3.13.rst?utm_source=openai))  \n  Source:  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>\n\n---\n\n## 2. How users obtain and enable it\n\n### Official binaries\n\n- **Windows:** Choose **Customize installation**, then select **Download free-threaded binaries**. This installs additional binaries beside the normal installation. The principal executable is `python3.13t.exe`; the runtime is registered under the `3.13t` tag and can be selected with `py.exe -3.13t`. Command-line installation can use `Include_freethreaded=1`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>\n\n- **macOS:** Choose **Customize** in the python.org installer and enable the **Free-threaded Python** package. It is not installed by default. It installs a separate `PythonT.framework` and normally provides `/usr/local/bin/python3.13t` and `python3.13t-config`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/mac.html#installing-free-threaded-binaries>\n\n- **macOS package environments are separate:** the traditional and free-threaded builds have separate search paths, `site-packages` directories, and pip installations. Packages needed in both may therefore have to be installed twice. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/mac.html#installing-free-threaded-binaries>\n\n### Source build\n\n- Build CPython using:\n\n  ```bash\n  ./configure --disable-gil\n  make\n  ```\n\n  `--disable-gil` defines `Py_GIL_DISABLED` and adds `t` to `sys.abiflags`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/configure.html#cmdoption-disable-gil>\n\n- **The free-threaded implementation requires CPython’s modified mimalloc allocator.** Python 3.13 bundles that allocator, and the release notes identify it as required for free-threaded mode. ([python.org](https://www.python.org/downloads/release/python-3130/?utm_source=openai))  \n  Source:  \n  <https://www.python.org/downloads/release/python-3130/>\n\n### Runtime control\n\nA free-threaded-capable executable can still run with the GIL enabled:\n\n```bash\npython3.13t -X gil=1 app.py\npython3.13t -X gil=0 app.py\n```\n\nor:\n\n```bash\nPYTHON_GIL=1 python3.13t app.py\nPYTHON_GIL=0 python3.13t app.py\n```\n\n`-X gil` takes precedence over `PYTHON_GIL`; forcing the GIL off is only available in a build configured with `--disable-gil`. ([docs.python.org](https://docs.python.org/3.13/using/cmdline.html))  \nSource:  \n<https://docs.python.org/3.13/using/cmdline.html#cmdoption-X>\n\n### Detection\n\n```python\nimport sys\nimport sysconfig\n\nprint(sys.version)\nprint(sys._is_gil_enabled())                    # Current process state\nprint(sysconfig.get_config_var(\"Py_GIL_DISABLED\"))  # Build capability\nprint(sys.abiflags)\n```\n\n- `python -VV` and `sys.version` identify an “experimental free-threading build”.\n- `sys._is_gil_enabled()` reports the current runtime GIL state.\n- `sysconfig.get_config_var(\"Py_GIL_DISABLED\") == 1` is the recommended build-configuration test. ([docs.python.org](https://docs.python.org/3.13/library/sys.html))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html#identifying-free-threaded-python>  \n  <https://docs.python.org/3.13/library/sys.html#sys._is_gil_enabled>\n\n---\n\n## 3. ABI and build-tag details\n\n- **The ordinary and free-threaded 3.13 builds have different ABIs.** PEP 703 states that `--disable-gil` is not ABI-compatible with the standard build; extension authors must target both ABIs where both are supported. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://peps.python.org/pep-0703/#python-build-modes>\n\n- The free-threaded ABI uses **`t` for “threading”**:\n  - `sys.abiflags` contains `t`;\n  - executables are normally `python3.13t`;\n  - extension shared libraries, binaries, and wheels use a `t` suffix;\n  - POSIX `pkg-config` metadata is named, for example, `python-3.13t.pc`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Sources:  \n  <https://docs.python.org/3.13/using/configure.html#cmdoption-disable-gil>  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#building-extensions-for-the-free-threaded-build>  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#build-changes>\n"},{"name":"read_tool_result","arguments":"{\"handle\":\"01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0\",\"offset\":120,\"limit\":160}","call_id":"call_w0NBoiNPXQPvdSdmFB5hOJjO","type":"function_call","id":"fc_0e22809e58aac363006a7f80c8a71481909eaf7c3b8b0f4e7d"},{"type":"function_call_output","call_id":"call_w0NBoiNPXQPvdSdmFB5hOJjO","output":"[handle ''01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0'': 306 matching line(s); showing 160]\n- **Native extensions must be compiled specifically for free-threaded CPython.** A binary built for normal CPython 3.13 is not the free-threaded extension ABI merely because the free-threaded interpreter can restore the GIL. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#building-extensions-for-the-free-threaded-build>  \n  <https://peps.python.org/pep-0703/#backwards-compatibility>\n\n- **The 3.13 free-threaded build does not support the Limited C API or Stable ABI for extension distribution.** Separate free-threaded wheels are required; an existing `abi3` wheel strategy continues to cover non-free-threaded versions only.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#limited-c-api-and-stable-abi>\n\n- `Py_GIL_DISABLED` is defined as `1` in free-threaded builds and is absent in normal builds. On Windows, the 3.13 extension HOWTO warns that it may need to be manually supplied when compiling extensions from source because of an installer limitation.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#identifying-the-free-threaded-build-in-c>\n\n**Inference:** In wheel terminology, the `t` ABI distinction is commonly exposed as a `cp313t`-style compatibility tag. The authoritative 3.13 claims are the documented `t` ABI suffix and requirement for separate wheels; tooling should derive the exact supported tags from the interpreter rather than hard-code them.\n\n---\n\n## 4. Extension compatibility and automatic GIL fallback\n\n### Declaring compatibility\n\nA C extension must explicitly declare that it does not need the GIL.\n\nFor multi-phase initialization:\n\n```c\nstatic PyModuleDef_Slot slots[] = {\n#if PY_VERSION_HEX >= 0x030D0000\n    {Py_mod_gil, Py_MOD_GIL_NOT_USED},\n#endif\n    {0, NULL}\n};\n```\n\nFor single-phase initialization, call:\n\n```c\n#ifdef Py_GIL_DISABLED\nPyUnstable_Module_SetGIL(module, Py_MOD_GIL_NOT_USED);\n#endif\n```\n\n`Py_mod_gil` defaults to `Py_MOD_GIL_USED` if omitted. `PyUnstable_Module_SetGIL()` is part of the Unstable API and is only available in free-threaded builds. ([docs.python.org](https://docs.python.org/3.13/c-api/module.html))  \nSources:  \n<https://docs.python.org/3.13/howto/free-threading-extensions.html#module-initialization>  \n<https://docs.python.org/3.13/c-api/module.html#c.Py_mod_gil>  \n<https://docs.python.org/3.13/c-api/module.html#c.PyUnstable_Module_SetGIL>\n\n### Fallback behavior\n\n- If an imported C extension does not explicitly declare free-threaded safety, CPython emits a warning and **enables the GIL for the process**. PEP 703 describes this as pausing the threads and enabling the GIL before continuing. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html#the-global-interpreter-lock-in-free-threaded-python>  \n  <https://peps.python.org/pep-0703/#py-mod-gil-slot>\n\n- Users can override this fallback with `PYTHON_GIL=0` or `-X gil=0`. This does **not** make an unsafe extension thread-safe; it only instructs CPython not to restore the GIL. ([docs.python.org](https://docs.python.org/3.13/using/cmdline.html))  \n  Sources:  \n  <https://docs.python.org/3.13/using/cmdline.html#envvar-PYTHON_GIL>  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>\n\n### Source-level extension changes\n\nMerely setting `Py_MOD_GIL_NOT_USED` is not sufficient unless the extension is genuinely thread-safe:\n\n- State formerly protected implicitly by the GIL may need explicit locks or thread-local storage.\n- Direct access to concurrently mutable C-API struct fields is unsafe.\n- Fast macros such as `PyList_GET_ITEM` do not lock.\n- Borrowed-reference APIs may be unsafe if another thread can mutate the owning container; new strong-reference APIs such as `PyList_GetItemRef()` and `PyDict_GetItemRef()` are provided.\n- `PyDict_Next()` does not lock and may need a critical section.\n- The object/memory allocation-domain distinction is a hard requirement: Python objects must use the object domain, while non-object buffers should not use `PyObject_Malloc()`.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html>\n\n- Thread-state/GIL APIs such as `PyGILState_Ensure()`, `PyEval_SaveThread()`, and `Py_BEGIN_ALLOW_THREADS` are still relevant because they also manage attached thread state and allow the cyclic collector to run around blocking operations.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#thread-state-and-gil-apis>\n\n---\n\n## 5. Known limitations\n\n### Performance and specialization\n\n- **The official 3.13 HOWTO reports approximately 40% overhead on `pyperformance` for the free-threaded build versus the ordinary GIL-enabled build.** Workloads dominated by C extensions or I/O may experience less impact.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html#single-threaded-performance>\n\n- The largest cited cause is that **PEP 659’s specializing adaptive interpreter is disabled in the 3.13 free-threaded build**.   \n  Source:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html#single-threaded-performance>\n\n- PEP 703 contains older reference-implementation estimates of roughly 5–8% overhead, but those are proposal-era measurements and should not be substituted for the shipped 3.13 documentation’s approximately 40% figure. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://peps.python.org/pep-0703/#performance>\n\n### JIT\n\n- **Sourced facts:** The 3.13 JIT/Tier-2 pipeline starts from specialized Tier-1 bytecode, while specialization is disabled in 3.13 free-threaded mode. A CPython maintainer also confirmed in the official issue tracker that when the GIL is disabled, the JIT is disabled at runtime in 3.13. ([github.com](https://github.com/python/cpython/blob/main/Doc/whatsnew/3.13.rst?utm_source=openai))  \n  Sources:  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#an-experimental-just-in-time-jit-compiler>  \n  <https://github.com/python/cpython/issues/129438>\n\n- **Inference:** Building 3.13 with both `--disable-gil` and `--enable-experimental-jit` does not provide a useful free-threaded JIT configuration. The source build may accept both options, but free-threaded execution does not obtain the JIT benefit.\n\n### Immortalization and memory use\n\nAfter the first additional thread starts, 3.13 immortalizes:\n\n- module-level functions;\n- method descriptors;\n- code objects;\n- module objects and module dictionaries;\n- classes/type objects.\n\nNumeric and string literals and strings returned by `sys.intern()` are also immortalized. These objects are never deallocated and their reference counts are not modified. Programs that dynamically create many such objects may therefore retain significantly more memory.   \nSource:  \n<https://docs.python.org/3.13/howto/free-threading-python.html#immortalization>\n\n**Inference:** Dynamic module/plugin loaders, notebook-like systems, code-generation systems, and applications that repeatedly construct classes are more exposed to this retention than applications with a mostly fixed module and class graph.\n\n### Frame objects\n\nAccessing another thread’s frame objects is unsafe and may crash the process. Consequently, `sys._current_frames()` is generally unsafe in 3.13 free-threaded mode. `inspect.currentframe()` and `sys._getframe()` are generally safe only while the resulting frame remains within its originating thread.   \nSource:  \n<https://docs.python.org/3.13/howto/free-threading-python.html#frame-objects>\n\n### Iterators\n\nSharing a single iterator object between threads is generally unsafe. The official documentation warns of duplicate or missing elements and possible interpreter crashes.   \nSource:  \n<https://docs.python.org/3.13/howto/free-threading-python.html#iterators>\n\n### Built-in container locking is not a language guarantee\n\n`dict`, `list`, and `set` use internal locking to approximate the safety behavior provided by the GIL, but Python has not historically guaranteed particular behavior for concurrent modification. Applications should use `threading.Lock` or other explicit synchronization rather than treating the current internal locking as a durable API contract.   \nSource:  \n<https://docs.python.org/3.13/howto/free-threading-python.html#thread-safety>\n\n### Memory allocators\n\nPEP 703 says wholesale replacement of CPython’s allocator with an allocator such as jemalloc or tcmalloc is not compatible with the free-threaded design; custom allocators must delegate actual allocation to the previously installed allocator. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSource:  \n<https://peps.python.org/pep-0703/#backwards-compatibility>\n\n### Object finalization timing\n\nPEP 703 documents that destructors and weak-reference callbacks for some code objects and top-level functions may be delayed until cyclic collection, and destruction of some cross-thread objects may be delayed slightly by biased reference counting. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSource:  \n<https://peps.python.org/pep-0703/#backwards-compatibility>\n\n---\n\n## 6. Packaging and ecosystem implications\n\n- **pip 24.1 or newer is required to install packages containing C extensions in a free-threaded 3.13 build.** ([github.com](https://github.com/python/cpython/blob/main/Doc/whatsnew/3.13.rst?utm_source=openai))  \n  Source:  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>\n\n- **Native projects need another wheel/build dimension:** operating system × architecture × Python feature version × ordinary/free-threaded ABI. A normal 3.13 wheel or `abi3` wheel does not satisfy the 3.13 free-threaded ABI requirement. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Sources:  "}],"instructions":"Search broadly before drawing conclusions.\nRead the sources that support each important claim.\nPrefer primary and authoritative sources.\nCite every factual claim with a direct source link.\nDistinguish sourced facts from your own inference.\n\nYou can delegate self-contained tasks to these sub-agents using the `delegate_task` tool. Each runs in its own fresh context and does not see this conversation, so pass everything it needs.\n\nAvailable sub-agents:\n- researcher: Research a focused sub-question on the web and report back with findings and source links","model":"gpt-5.6-sol","reasoning":{"effort":"none","context":"all_turns"},"stream":false,"tool_choice":"auto","tools":[{"type":"web_search","search_context_size":"medium"},{"name":"web_fetch","parameters":{"additionalProperties":false,"properties":{"url":{"description":"The URL to fetch.","type":"string"}},"required":["url"],"type":"object"},"type":"function","description":"Fetches the content of a web page at the given URL and returns it as markdown or binary content.","strict":true},{"name":"delegate_task","parameters":{"additionalProperties":false,"properties":{"agent_name":{"description":"Name of the sub-agent to run. Must be one of the agents\nlisted in the instructions.","type":"string"},"task":{"description":"The complete, self-contained instruction for the sub-agent.","type":"string"}},"required":["agent_name","task"],"type":"object"},"type":"function","description":"Delegate a self-contained task to a named sub-agent and return its result.\n\nThe sub-agent runs in its own fresh context and does not see this\nconversation, so `task` must contain everything it needs.","strict":true},{"name":"read_tool_result","parameters":{"additionalProperties":false,"properties":{"handle":{"description":"The handle from the overflowed tool return.","type":"string"},"offset":{"default":0,"description":"Number of matching lines to skip from the start (or end). Must be >= 0.","type":"integer"},"limit":{"default":200,"description":"Maximum number of lines to return (>= 1; clamped to a built-in cap).","type":"integer"},"from_end":{"default":false,"description":"Count `offset`/`limit` from the end of the result.","type":"boolean"},"pattern":{"default":null,"description":"Optional literal substring; only lines containing it are returned.","anyOf":[{"type":"string"},{"type":"null"}]}},"required":["handle"],"type":"object"},"type":"function","description":"Read a slice of a spilled tool result.","strict":false}]}'
