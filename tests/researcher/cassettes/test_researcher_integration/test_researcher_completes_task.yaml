described as experimental, with expected bugs and substantial single-threaded overhead. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSources:  \n<https://docs.python.org/3.13/howto/free-threading-python.html>  \n...[17,734 chars omitted]...\nion opt-in, and substantive thread-safety work. Unsupported extensions cause a process-wide GIL fallback unless the user forcibly overrides it. The most consequential 3.13 limitations are approximately 40% Python-code overhead, disabled specialization and effectively unavailable JIT acceleration, broad immortalization with possible memory growth, unsafe cross-thread frame access, unsafe shared iterators, no Stable ABI/Limited API distribution target, and restrictions on custom memory allocators."},{"id":"ws_0e22809e58aac363006a7f80b8b4fc819098bae51ad0c49d36","action":{"type":"search","queries":["site:docs.python.org/3.14 howto free threading Python 3.14","site:docs.python.org/3.14 whatsnew 3.14 free-threaded Python","site:peps.python.org free-threaded Python 3.14 PEP 779","site:python.org Python 3.14 free-threaded officially supported"],"query":"site:docs.python.org/3.14 howto free threading Python 3.14"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80bc82cc8190a83f00c9acb010e9","action":{"type":"search","queries":["site:docs.python.org/3.14/howto free-threading-extensions limited API stable ABI free-threaded","site:docs.python.org/3.14/c-api free-threaded Py_GIL_DISABLED extension module GIL","site:packaging.python.org free-threaded cp314t wheel tag official","site:peps.python.org cp314t free threaded ABI tag"],"query":"site:docs.python.org/3.14/howto free-threading-extensions limited API stable ABI free-threaded"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80c029208190ade969ee5c3622b7","action":{"type":"open_page","url":"https://peps.python.org/pep-0779/"},"status":"completed","type":"web_search_call"},{"id":"ws_0e22809e58aac363006a7f80c2c0dc8190a896243925e3b3b2","action":{"type":"open_page","url":"https://docs.python.org/3.13/howto/free-threading-python.html"},"status":"completed","type":"web_search_call"},{"name":"read_tool_result","arguments":"{\"handle\":\"01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0\",\"offset\":0,\"limit\":120}","call_id":"call_A0K8Cm58j9hDaLmoqUTZxaVI","type":"function_call","id":"fc_0e22809e58aac363006a7f80c5f7ac8190a53170a0a6f37d5a"},{"type":"function_call_output","call_id":"call_A0K8Cm58j9hDaLmoqUTZxaVI","output":"[handle ''01a0020c-26d3-7125-9757-cd9c6e45489d/call_qA5Ef9pl7orsjfymFbkdkQpI.0'': 306 matching line(s); showing 120]\n# CPython 3.13 free-threaded support\n\n## Executive summary\n\n**Sourced fact:** CPython 3.13’s free-threaded build is **experimental, optional, and not enabled in the normal CPython build**. PEP 703 itself is accepted/final, but the shipped 3.13 implementation is still explicitly described as experimental, with expected bugs and substantial single-threaded overhead. ([peps.python.org](https://peps.python.org/pep-0703/))  \nSources:  \n<https://docs.python.org/3.13/howto/free-threading-python.html>  \n<https://peps.python.org/pep-0703/>\n\n**Practical assessment — inference:** Treat 3.13 free-threading as a testing, porting, and evaluation target rather than a transparent production replacement for ordinary CPython. That inference follows from its experimental designation, approximately 40% Python-code overhead, disabled specialization, native-extension ABI split, automatic GIL fallback, and documented crash-prone cases.\n\n---\n\n## 1. Maturity and experimental status\n\n- **CPython 3.13 as a release is stable, but its free-threaded build mode is experimental.** It is not enabled by default, may contain bugs, and has a substantial single-threaded performance penalty. ([python.org](https://www.python.org/downloads/release/python-3130/?utm_source=openai))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html>  \n  <https://www.python.org/downloads/release/python-3130/>\n\n- **PEP 703 is “Final” and targets Python 3.13.** This means the proposal was accepted and implemented; it does **not** override the 3.13 documentation’s experimental-status warning. The Steering Council’s acceptance also explicitly provided for gradual rollout and possible rollback if disruption proved excessive. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://peps.python.org/pep-0703/>\n\n- **The capability is a separate CPython build configuration**, not merely a switch that turns an ordinary 3.13 installation into free-threaded CPython. The free-threaded executable is normally named `python3.13t` or `python3.13t.exe`. ([github.com](https://github.com/python/cpython/blob/main/Doc/whatsnew/3.13.rst?utm_source=openai))  \n  Source:  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#free-threaded-cpython>\n\n---\n\n## 2. How users obtain and enable it\n\n### Official binaries\n\n- **Windows:** Choose **Customize installation**, then select **Download free-threaded binaries**. This installs additional binaries beside the normal installation. The principal executable is `python3.13t.exe`; the runtime is registered under the `3.13t` tag and can be selected with `py.exe -3.13t`. Command-line installation can use `Include_freethreaded=1`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/windows.html#installing-free-threaded-binaries>\n\n- **macOS:** Choose **Customize** in the python.org installer and enable the **Free-threaded Python** package. It is not installed by default. It installs a separate `PythonT.framework` and normally provides `/usr/local/bin/python3.13t` and `python3.13t-config`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/mac.html#installing-free-threaded-binaries>\n\n- **macOS package environments are separate:** the traditional and free-threaded builds have separate search paths, `site-packages` directories, and pip installations. Packages needed in both may therefore have to be installed twice. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/mac.html#installing-free-threaded-binaries>\n\n### Source build\n\n- Build CPython using:\n\n  ```bash\n  ./configure --disable-gil\n  make\n  ```\n\n  `--disable-gil` defines `Py_GIL_DISABLED` and adds `t` to `sys.abiflags`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://docs.python.org/3.13/using/configure.html#cmdoption-disable-gil>\n\n- **The free-threaded implementation requires CPython’s modified mimalloc allocator.** Python 3.13 bundles that allocator, and the release notes identify it as required for free-threaded mode. ([python.org](https://www.python.org/downloads/release/python-3130/?utm_source=openai))  \n  Source:  \n  <https://www.python.org/downloads/release/python-3130/>\n\n### Runtime control\n\nA free-threaded-capable executable can still run with the GIL enabled:\n\n```bash\npython3.13t -X gil=1 app.py\npython3.13t -X gil=0 app.py\n```\n\nor:\n\n```bash\nPYTHON_GIL=1 python3.13t app.py\nPYTHON_GIL=0 python3.13t app.py\n```\n\n`-X gil` takes precedence over `PYTHON_GIL`; forcing the GIL off is only available in a build configured with `--disable-gil`. ([docs.python.org](https://docs.python.org/3.13/using/cmdline.html))  \nSource:  \n<https://docs.python.org/3.13/using/cmdline.html#cmdoption-X>\n\n### Detection\n\n```python\nimport sys\nimport sysconfig\n\nprint(sys.version)\nprint(sys._is_gil_enabled())                    # Current process state\nprint(sysconfig.get_config_var(\"Py_GIL_DISABLED\"))  # Build capability\nprint(sys.abiflags)\n```\n\n- `python -VV` and `sys.version` identify an “experimental free-threading build”.\n- `sys._is_gil_enabled()` reports the current runtime GIL state.\n- `sysconfig.get_config_var(\"Py_GIL_DISABLED\") == 1` is the recommended build-configuration test. ([docs.python.org](https://docs.python.org/3.13/library/sys.html))  \n  Sources:  \n  <https://docs.python.org/3.13/howto/free-threading-python.html#identifying-free-threaded-python>  \n  <https://docs.python.org/3.13/library/sys.html#sys._is_gil_enabled>\n\n---\n\n## 3. ABI and build-tag details\n\n- **The ordinary and free-threaded 3.13 builds have different ABIs.** PEP 703 states that `--disable-gil` is not ABI-compatible with the standard build; extension authors must target both ABIs where both are supported. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Source:  \n  <https://peps.python.org/pep-0703/#python-build-modes>\n\n- The free-threaded ABI uses **`t` for “threading”**:\n  - `sys.abiflags` contains `t`;\n  - executables are normally `python3.13t`;\n  - extension shared libraries, binaries, and wheels use a `t` suffix;\n  - POSIX `pkg-config` metadata is named, for example, `python-3.13t.pc`. ([peps.python.org](https://peps.python.org/pep-0703/))  \n  Sources:  \n  <https://docs.python.org/3.13/using/configure.html#cmdoption-disable-gil>  \n  <https://docs.python.org/3.13/howto/free-threading-extensions.html#building-extensions-for-the-free-threaded-build>  \n  <https://docs.python.org/3.13/whatsnew/3.13.html#build-changes>\n"}],"instructions":"Search broadly before drawing conclusions.\nRead the sources that support each important claim.\nPrefer primary and authoritative sources.\nCite every factual claim with a direct source link.\nDistinguish sourced facts from your own inference.\n\nYou can delegate self-contained tasks to these sub-agents using the `delegate_task` tool. Each runs in its own fresh context and does not see this conversation, so pass everything it needs.\n\nAvailable sub-agents:\n- researcher: Research a focused sub-question on the web and report back with findings and source links","model":"gpt-5.6-sol","reasoning":{"effort":"none","context":"all_turns"},"stream":false,"tool_choice":"auto","tools":[{"type":"web_search","search_context_size":"medium"},{"name":"web_fetch","parameters":{"additionalProperties":false,"properties":{"url":{"description":"The URL to fetch.","type":"string"}},"required":["url"],"type":"object"},"type":"function","description":"Fetches the content of a web page at the given URL and returns it as markdown or binary content.","strict":true},{"name":"delegate_task","parameters":{"additionalProperties":false,"properties":{"agent_name":{"description":"Name of the sub-agent to run. Must be one of the agents\nlisted in the instructions.","type":"string"},"task":{"description":"The complete, self-contained instruction for the sub-agent.","type":"string"}},"required":["agent_name","task"],"type":"object"},"type":"function","description":"Delegate a self-contained task to a named sub-agent and return its result.\n\nThe sub-agent runs in its own fresh context and does not see this\nconversation, so `task` must contain everything it needs.","strict":true},{"name":"read_tool_result","parameters":{"additionalProperties":false,"properties":{"handle":{"description":"The handle from the overflowed tool return.","type":"string"},"offset":{"default":0,"description":"Number of matching lines to skip from the start (or end). Must be >= 0.","type":"integer"},"limit":{"default":200,"description":"Maximum number of lines to return (>= 1; clamped to a built-in cap).","type":"integer"},"from_end":{"default":false,"description":"Count `offset`/`limit` from the end of the result.","type":"boolean"},"pattern":{"default":null,"description":"Optional literal substring; only lines containing it are returned.","anyOf":[{"type":"string"},{"type":"null"}]}},"required":["handle"],"type":"object"},"type":"function","description":"Read a slice of a spilled tool result.","strict":false}]}'
